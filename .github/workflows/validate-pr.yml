name: Validate PR branches

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check source and target branches
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_BRANCH" == "dev" && "$HEAD_BRANCH" == feat/* ]]; then
            exit 0
          fi

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" == "dev" ]]; then
            exit 0
          fi

          echo "Invalid PR: $HEAD_BRANCH -> $BASE_BRANCH"
          echo "Allowed: feat/* -> dev, dev -> main"
          exit 1
