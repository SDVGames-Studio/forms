
name: Native platform builds

on:
  workflow_call:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7-stable

jobs:
  export:
    name: Export Native Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot and export templates
        run: |
          set -e
          curl -L --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

          curl -L --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable
          unzip -o /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION%-stable}.stable/

      - name: Disable Godot MCP for CI
        run: python3 scripts/disable_godot_mcp.py

      - name: Import project assets
        run: godot --headless --editor --import --path .

      - name: Setup Android signing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jre-headless
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$GITHUB_WORKSPACE/.android"
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/.android/forms-release.p12"
          chmod 600 "$GITHUB_WORKSPACE/.android/forms-release.p12"
          test -s "$GITHUB_WORKSPACE/.android/forms-release.p12"

      - name: Verify Android release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/.android/forms-release.p12" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Export Android
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/.android/forms-release.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/Forms.apk
          test -s build/android/Forms.apk

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/Forms.x86_64
          test -s build/linux/Forms.x86_64
          test -s build/linux/Forms.pck

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows" build/windows/Forms.exe
          test -s build/windows/Forms.exe

      - name: Upload native build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: forms-builds
          path: |
            build/linux/Forms.x86_64
            build/linux/Forms.pck
            build/windows/Forms.exe
            build/android/Forms.apk
          if-no-files-found: error
          retention-days: 30
