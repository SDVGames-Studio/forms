
name: Upload release assets

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: Upload native builds
    runs-on: ubuntu-latest

    steps:
      - name: Download native builds
        uses: actions/download-artifact@v8
        with:
          name: forms-builds
          path: dist

      - name: Wait for GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            if gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi

            echo "Waiting for semantic-release..."
            sleep 10
          done

          echo "GitHub Release was not created."
          exit 1

      - name: Upload native builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "$GITHUB_REF_NAME" \
            dist/linux/Forms.x86_64 \
            dist/linux/Forms.pck \
            dist/windows/Forms.exe \
            dist/android/Forms.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
